name: 删除 CNB 旧发布

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    name: 删除 CNB v1.8.2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 删除 CNB Release
        env:
          CNB_RELEASE_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
        run: |
          node -e '
          const token = process.env.CNB_RELEASE_TOKEN;
          if (!token) throw new Error("Missing CNB_RELEASE_TOKEN");
          const base = "https://api.cnb.cool/diandao-app/diandao-chaoxing/-/releases";
          const headers = { Authorization: "Bearer " + token, Accept: "application/vnd.cnb.api+json" };
          (async () => {
            const get = await fetch(base + "/tags/v1.8.2", { headers, signal: AbortSignal.timeout(20000) });
            if (get.status === 404) { console.log("CNB release v1.8.2 already absent"); return; }
            if (!get.ok) throw new Error("GET release failed HTTP " + get.status);
            const release = await get.json();
            const del = await fetch(base + "/" + encodeURIComponent(release.id), { method: "DELETE", headers, signal: AbortSignal.timeout(20000) });
            console.log("DELETE release " + release.id + " HTTP " + del.status);
            if (!del.ok && del.status !== 404) throw new Error("DELETE release failed");
          })().catch(e => { console.error(e.message); process.exit(1); });
          '
      - name: 删除 CNB tag v1.8.2
        env:
          CNB_RELEASE_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://cnb.cool/.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'cnb:%s' "$CNB_RELEASE_TOKEN" | base64 -w0)"
          git push https://cnb.cool/diandao-app/diandao-chaoxing :refs/tags/v1.8.2 || echo 'CNB tag v1.8.2 already absent'